name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet build src/CarryWeight -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: CarryWeight
          path: src/CarryWeight/bin/Release/net48/CarryWeight.dll
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/CarryWeight/bin/Release/net48/CarryWeight.dll
